
name: NEXUS GAME BOOSTER APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip NEXUS-GAME-BOOSTER-2.0-CYBER-EXTREME.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: source/NexusGameBooster
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS BOOSTER
          path: source/NexusGameBooster/app/build/outputs/apk/debug/app-debug.apk
